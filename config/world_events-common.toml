#Scales how hard the weather events hit (earthquake shoves, lightning odds, gale gusts,
#freezing, heat and ash damage...). 1.0 = default, 0.5 = gentler, 2.0 = brutal.
#Range: 0.0 ~ 5.0
weatherIntensity = 1.0

[general]
	#Random events (commands still work when off).
	enabled = true
	#How often the game tries to start a random event.
	#Range: 5 ~ 3600
	checkIntervalSeconds = 60
	#Chance (0-1) per check that an event starts, once the cooldown is over.
	#Range: 0.0 ~ 1.0
	eventChance = 0.12
	#Minimum time between the end of an event and the start of the next one.
	#Range: 0 ~ 1440
	minutesBetweenEvents = 15

#World eras: every few days a new era starts. The world's threat level is the era plus
#the boss milestones; it makes hostile mobs stronger, elites and dangerous events more frequent,
#and unlocks events with a minThreat.
[eras]
	enabled = true
	#In-game days (counted from world creation, /time set doesn't change it).
	#Range: 1 ~ 1000
	daysPerEra = 10
	#Range: 1 ~ 100
	maxEra = 10
	#Extra max health for hostile mobs and bosses per threat level above 1 (0.1 = +10%).
	#Range: 0.0 ~ 10.0
	healthPerEra = 0.1
	#Extra damage for hostile mobs and bosses per threat level above 1: melee, arrows,
	#fireballs, spells, abilities and breath attacks.
	#Range: 0.0 ~ 10.0
	damagePerEra = 0.05
	#Extra Elite Mobs spawn chance per threat level above 1 (only with Elite Mobs).
	#Range: 0.0 ~ 10.0
	eliteChancePerEra = 0.1
	#Extra chance of dangerous events per threat level above 1.
	#Range: 0.0 ~ 10.0
	eventChancePerEra = 0.1
	#Wild Ice and Fire dragons get this fraction of damagePerEra (0.5 = half). Tamed dragons don't scale.
	#Range: 0.0 ~ 10.0
	dragonDamageFactor = 0.5

[progression]

	#Boss milestones: the first kill of each boss type (forge:bosses tag: Wither, Ender Dragon,
	#Cataclysm, Iron's Spells...) permanently raises the world's threat level.
	[progression.boss_milestones]
		enabled = true
		#Range: 0 ~ 10
		threatPerBoss = 1
		#Cap of era + milestones.
		#Range: 1 ~ 200
		maxThreat = 20

	#LevelZ threat: more elites spawn near players with a high LevelZ level (needs LevelZ and Elite Mobs).
	[progression.levelz_threat]
		#Extra elite chance per LevelZ level of the nearest player (0.01 = level 50 -> x1.5). 0 disables it.
		#Range: 0.0 ~ 1.0
		eliteChancePerLevel = 0.01

	#Cursed zones: overworld chunks with a lot of killing (or player deaths) become cursed: more elites
	#and dark particles. A splash potion of Healing thrown in the chunk cleanses it.
	[progression.cursed_zones]
		enabled = true
		#Points needed to curse a chunk (points halve every in-game day).
		#Range: 1 ~ 100000
		threshold = 60
		#Points per hostile mob killed by a player.
		#Range: 0 ~ 1000
		killPoints = 1
		#Points per player death.
		#Range: 0 ~ 1000
		deathPoints = 10
		#Range: 1.0 ~ 100.0
		eliteChanceMultiplier = 2.0

	#Insomnia: every night nobody sleeps makes night events more likely.
	[progression.insomnia]
		enabled = true
		#Sleepless nights before players are warned.
		#Range: 1 ~ 100
		warnNights = 3
		#Extra weight of night events and extra event chance at night, per sleepless night.
		#Range: 0.0 ~ 10.0
		bonusPerNight = 0.5

	#Distance threat: every blocksPerLevel blocks away from the world spawn adds a threat level to the mobs
	#that spawn there (health, damage and elite chance), on top of era + boss milestones. Not in the End.
	[progression.distance_threat]
		enabled = true
		#Blocks from the spawn per extra threat level; the first ring is a safe zone.
		#Range: 16 ~ 1000000
		blocksPerLevel = 1000
		#Range: 0 ~ 100
		maxLevels = 5
		#Nether distance counts this many times (8 = like overworld coordinates). 0 disables it in the Nether.
		#Range: 0.0 ~ 64.0
		netherScale = 8.0
		#Action bar message when a player enters a zone with a different threat.
		messages = true

#Each event: enabled, weight (relative chance), duration and minThreat (world threat level needed).
[acid_rain]
	enabled = true
	#Relative chance of being picked among the events that can start.
	#Range: 0 ~ 1000
	weight = 10
	#Duration in minutes.
	#Range: 1 ~ 1440
	minMinutes = 3
	#Range: 1 ~ 1440
	maxMinutes = 6
	#World threat level (era + boss milestones) needed for it to happen randomly.
	#Range: 1 ~ 200
	minThreat = 1
	#Flat durability lost per corrosion tick by the held items and each armor piece (Unbreaking applies).
	#Range: 0 ~ 100
	durabilityDamage = 2
	#Seconds between corrosion ticks.
	#Range: 1 ~ 60
	corrosionIntervalSeconds = 2
	#Extra durability lost per corrosion tick, as a percentage of the item's max durability,
	#so diamond and netherite gear suffers as much as iron (1.0 = 1%).
	#Range: 0.0 ~ 100.0
	durabilityPercent = 1.0
	#Whether acid rain can fully break items. When false they stop at 1 durability.
	canBreakItems = false

